; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_size = 4MB
board_build.partitions = default_4MB.csv

; Debug configuration
debug_tool = esp-builtin
debug_init_break = tbreak setup

; Library dependencies
lib_deps = 
    ; Sensor libraries
    adafruit/DHT sensor library@^1.4.4
    adafruit/Adafruit Unified Sensor@^1.1.6
    
    ; Display libraries
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.10
    
    ; WiFi and Web libraries
    bblanchon/ArduinoJson@^6.21.3
    ; WebServer and DNSServer are included in ESP32 framework
    
    ; Servo library (if using servo egg turner)
    ; madhephaestus/ESP32Servo@^0.13.0

; Build flags
build_flags = 
    -Werror
    -Wall
    -Wextra
    -DOLED_ON
    ; Uncomment for servo egg turner:
    ; -DEGGS_TURNER_SERVO_PIN=21
    ; Uncomment for relay egg turner:
    ; -DEGGS_TURNER_PIN=10
    ; Uncomment for LED feedback:
    ; -DLEDS_ON

; Upload configuration
upload_port = /dev/ttyUSB0  ; Update with your port
upload_protocol = esp-builtin

; Monitor configuration
monitor_filters = 
    colorize
    time
    log2file

; Extra script hooks
extra_scripts = 
    pre:scripts/pre_build.py
    post:scripts/post_build.py

[env:arduino-uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

; Library dependencies (same as ESP32 where possible)
lib_deps = 
    adafruit/DHT sensor library@^1.4.4
    adafruit/Adafruit Unified Sensor@^1.1.6
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.10

; Build flags for Arduino
build_flags = 
    -Werror
    -Wall
    -Wextra
    -DOLED_ON
    ; Arduino Uno specific pins
    -DFAN_PIN=9
    -DLIGHT_PIN=10
    ; Uncomment for LED feedback:
    ; -DLEDS_ON

; Note: WiFi features will be automatically excluded for non-ESP32 platforms

[env:development]
extends = env:esp32-c3
build_type = debug
build_flags = ${env:esp32-c3.build_flags}
    -DDEBUG=1
    -DCORE_DEBUG_LEVEL=5
    -fsanitize=address
    -fno-omit-frame-pointer

[env:production]
extends = env:esp32-c3
build_type = release
build_flags = ${env:esp32-c3.build_flags}
    -DNDEBUG
    -Os
    -flto

; Test environments
[env:test-unit]
extends = env:esp32-c3
build_flags = ${env:esp32-c3.build_flags}
    -DTEST_UNIT=1
    -DOLED_ON=0
    -DLEDS_ON=0

[env:test-integration]
extends = env:esp32-c3
build_flags = ${env:esp32-c3.build_flags}
    -DTEST_INTEGRATION=1

; PlatformIO project tasks
[platformio]
description = ESP32 Incubator Controller with WiFi
src_dir = .
include_dir = 
    .
    include
lib_dir = 
    lib
    .pio/libdeps
data_dir = data
extra_configs = 
    extra/boards.ini
    extra/debug.ini

; Default environment
default_envs = esp32-c3

; Custom targets
[targets]
uploadfs = 
    platformio run --target uploadfs
erase = 
    platformio run --target erase
size = 
    platformio run --target size
check = 
    platformio check
test = 
    platformio test

; Custom upload options
[upload]
; Use esptool.py for ESP32
use = esptool
; Use avrdude for Arduino
; use = avrdude

; Custom monitor options
[monitor]
; Add timestamp to monitor output
timestamp = 1
; Filter out certain messages
filters = 
    default
    time
    colorize
; Custom baud rate for specific boards
baud = 115200

; Custom debug options
[debug]
; GDB server configuration
port = 3333
; GDB client configuration
tool = gdb
; Debug adapter configuration
adapter = esp-builtin

; Project metadata
[metadata]
name = ESP32 Incubator Controller
version = 1.0.0
description = Smart incubator with WiFi remote monitoring
author = Your Name
license = MIT
homepage = https://github.com/yourusername/esp32-incubator
repository = https://github.com/yourusername/esp32-incubator.git
keywords = 
    esp32
    incubator
    iot
    temperature-control
    wifi
    arduino

; Custom sections for documentation
[documentation]
format = markdown
files = 
    README.md
    INSTALL.md
    TESTING.md
    CHANGELOG.md
output = docs

; Custom sections for CI/CD
[ci]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
lib_deps = ${env:esp32-c3.lib_deps}
build_flags = ${env:esp32-c3.build_flags}

; Notes for users
; 1. Update upload_port to match your ESP32's serial port
; 2. Uncomment the appropriate egg turner option (servo or relay)
; 3. Adjust pin definitions in config.h if needed
; 4. For production, use the 'production' environment
; 5. For debugging, use the 'development' environment